name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: `next lint` was removed in Next 16 and no ESLint config exists yet.
      # ESLint setup is a follow-up; type-check + build are the gates for now.
      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Dummy values so `next build` doesn't fail on missing runtime env.
          # Real secrets are configured in the Vercel project, not in CI.
          NEXT_TELEMETRY_DISABLED: "1"
